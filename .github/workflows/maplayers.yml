name: Monthly map-layer refresh

on:
  schedule:
    - cron: '30 11 2 * *'    # 2nd of each month, 11:30 UTC — shootings (NYPD posts quarterly), evictions, HPD, transit; every district
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh              # same group as the daily job, so the two never push at once
  cancel-in-progress: false

jobs:
  maplayers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # the branch head when the job starts, not the commit that triggered it, so queued jobs never push stale
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install shapely
      - name: Rebuild map layers for every district
        run: |
          cd build
          status=0
          for f in ../districts/*.json; do
            code=$(basename "$f" .json)
            python3 maplayers.py "$code" || { echo "::error::$code map layers failed"; status=1; }
          done
          exit $status
      - name: Commit if changed
        run: |
          git config user.name "district-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly map-layer refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
